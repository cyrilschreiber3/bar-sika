[project]
name = "bar-sika"
version = "1.1.0"
description = "Bar Sika audio application"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "flask-socketio>=5.5.1",
    "gpiozero>=2.0.1",
    "pigpio>=1.78",
    "pygame>=2.6.1",
]

[project.scripts]
bar-sika = "bar_sika.main:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

# [tool.uv.extra-build-dependencies]
# "RPi.GPIO-0.7.1" = ["setuptools>=80.9.0"]
